name: multimodal-platform-infrastructure

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-multimodal_platform}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${INFRA_MYSQL_ROOT_PASSWORD:?INFRA_MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u "$$MYSQL_USER" --password="$$MYSQL_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The upstream minio/minio images were withdrawn from Docker Hub and quay.io;
  # this frozen Bitnami build is still pullable and only serves Milvus internally.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${INFRA_MINIO_ROOT_USER:?INFRA_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${INFRA_MINIO_ROOT_PASSWORD:?INFRA_MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Milvus Standalone: one Milvus process with etcd, MinIO, and embedded Woodpecker.
  milvus:
    image: milvusdb/milvus:v2.6.23
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${INFRA_MINIO_ROOT_USER:?INFRA_MINIO_ROOT_USER is required}
      MINIO_SECRET_ACCESS_KEY: ${INFRA_MINIO_ROOT_PASSWORD:?INFRA_MINIO_ROOT_PASSWORD is required}
      MQ_TYPE: woodpecker
      COMMON_SECURITY_AUTHORIZATIONENABLED: "false"
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 90s

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
